<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 52" role="img" aria-labelledby="title"><title id="title">IT Undergraduate at University of Moratuwa. Aspiring software engineer exploring backend, full-stack development, DevOps, cloud and distributed systems.</title><style>
/* 7 lines x 4s = 28s cycle. Each line is visible for 1/7 of the cycle, in document order. */
.line{opacity:0;animation:cycle 28s infinite}
@keyframes cycle{0%,14%{opacity:1}14.2857%,100%{opacity:0}}
.type{animation:typing 4s steps(56,end) infinite}
@keyframes typing{0%{width:0}70%,94%{width:740px}100%{width:0}}
@media(prefers-reduced-motion:reduce){.line,.type{animation:none}.line{opacity:0}.line:first-of-type{opacity:1}.type{width:740px}}
</style><defs><clipPath id="typing"><rect class="type" width="740" height="52"/></clipPath></defs><rect width="760" height="52" rx="8" fill="#0d1117"/><text x="14" y="33" fill="#a78bfa" font-family="monospace" font-size="22">&gt;</text><g clip-path="url(#typing)" fill="#67e8f9" font-family="monospace" font-size="22"><text class="line" x="40" y="33" style="animation-delay:0s">IT Undergraduate @ University of Moratuwa</text><text class="line" x="40" y="33" style="animation-delay:4s">Aspiring Software Engineer</text><text class="line" x="40" y="33" style="animation-delay:8s">Backend Developer</text><text class="line" x="40" y="33" style="animation-delay:12s">Full-Stack Developer</text><text class="line" x="40" y="33" style="animation-delay:16s">DevOps Enthusiast</text><text class="line" x="40" y="33" style="animation-delay:20s">Learning by Building</text><text class="line" x="40" y="33" style="animation-delay:24s">Exploring Cloud &amp; Distributed Systems</text></g></svg>
