name: Update contribution snake

on:
  schedule:
    - cron: '23 3 * * 1' # Monday 03:23 UTC / 08:53 Asia/Colombo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'amila-pathum/amila-pathum' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: amila-pathum
          outputs: |
            assets/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=%237c3aed
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee

      - name: Commit changed animations
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          files=(assets/github-contribution-grid-snake-light.svg assets/github-contribution-grid-snake-dark.svg)
          for file in "${files[@]}"; do
            test -s "$file"
            grep -q '<svg' "$file"
          done
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "Contribution animations are unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): update contribution snake animations'
          # Authenticate only for push; do not persist credentials in the checkout.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
